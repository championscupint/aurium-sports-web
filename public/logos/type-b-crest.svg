  <path d="M28 190 L472 190 L456 264 L44 264 Z" fill="#071120" stroke="url(#rim_typeb)" stroke-width="5.5"/>
  <text x="250" y="228" font-family="'Outfit', 'Georgia', serif" font-size="31" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2.5">AIC TITANS CUP</text>
  <text x="250" y="252" font-family="'Inter', 'Arial', sans-serif" font-size="12" font-weight="800" fill="#6EE7B7" text-anchor="middle" letter-spacing="4">TYPE B · DEVELOPMENT BANKS</text>

  <!-- Bottom Competition Classification Pill -->
