  <!-- Competition Accent Header Field -->
  <path d="M88 64 L250 48 L412 64 L412 206 L88 206 Z" fill="url(#accent_typeb)" opacity="0.92"/>

  
        <g fill="#6EE7B7">
          <circle cx="190" cy="78" r="4"/><circle cx="220" cy="70" r="5"/><circle cx="250" cy="66" r="6.5"/><circle cx="280" cy="70" r="5"/><circle cx="310" cy="78" r="4"/>
        </g>
        

