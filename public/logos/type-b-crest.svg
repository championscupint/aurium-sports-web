    <rect x="206" y="96" width="22" height="90" rx="2"/>
    <rect x="272" y="96" width="22" height="90" rx="2"/>
    <rect x="324" y="114" width="20" height="72" rx="2"/>
    <polygon points="142,114 250,74 358,114"/>
  </g>
  <polygon points="88,206 155,150 205,178 250,126 302,174 355,146 412,206" fill="#071120" opacity="0.82"/>

  <!-- Lower Pitch & Trophy Cup -->
  <path d="M120 264 C146 356 214 432 250 466 C286 432 354 356 380 264 Z" fill="#0B162C" stroke="#059669" stroke-width="2.5"/>
  <path d="M150 272 C172 346 218 408 250 438" fill="none" stroke="#059669" stroke-width="13" stroke-linecap="round"/>
  <path d="M350 272 C328 346 282 408 250 438" fill="none" stroke="#D4A017" stroke-width="13" stroke-linecap="round"/>

  <!-- Trophy & Football Centerpiece -->
  <circle cx="250" cy="296" r="29" fill="#FFFFFF" stroke="#071120" stroke-width="3"/>
  <polygon points="250,280 263,289 258,304 242,304 237,289" fill="#071120"/>
  <path d="M208 318 H292 L278 400 C274 420 262 432 250 432 C238 432 226 420 222 400 Z" fill="url(#rim_typeb)" stroke="#451A03" stroke-width="2.5"/>
